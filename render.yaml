# ==============================================================================
# Render Blueprint Specification for Vertex Construction & PCCC Quote System
# Free Tier Ready - One-Click Cloud Deployment
# ==============================================================================
services:
  - type: web
    name: vertex-quote-system
    runtime: python
    region: singapore # Tốc độ truy cập tối ưu cho Việt Nam
    plan: free # Sử dụng gói Free miễn phí 100% của Render
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python run.py --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: HOST
        value: "0.0.0.0"
      - key: SECRET_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: groq
      - key: AI_MODEL_NAME
        value: llama-3.3-70b-versatile
      - key: AI_API_KEY
        sync: false # Nhập API Key trên Render Dashboard hoặc để trống dùng rule-based fallback
      - key: WEB_CONCURRENCY
        value: "2"
